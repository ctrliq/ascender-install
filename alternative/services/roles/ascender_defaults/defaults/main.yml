---
# Shared defaults for every role (role defaults have the lowest precedence, so
# anything in the inventory or group_vars overrides them).

# --- What to install -----------------------------------------------------------
ascender_repo: https://github.com/ctrliq/ascender.git
ascender_version: "25.6.2"          # git tag, branch or commit
ascender_python: python3.12         # python3.12 for the 25.x releases, python3.14 for main
ascender_receptor_version: "1.6.8"
ascender_receptor_arch: "{{ 'arm64' if ansible_facts['architecture'] == 'aarch64' else 'amd64' }}"

# --- Access -----------------------------------------------------------------
ascender_hostname: "{{ ansible_facts['fqdn'] }}"
ascender_http_mode: redirect        # redirect | insecure
ascender_node_name: "{{ ansible_facts['nodename'] }}"   # Instance name and receptor node id
ascender_admin_user: admin
ascender_admin_password: ""         # generated on first run when empty
ascender_admin_email: admin@example.com
ascender_manage_firewalld: true

# --- Database -----------------------------------------------------------------
ascender_pg_version: "15"
ascender_pg_database: ascender
ascender_pg_user: ascender
ascender_pg_password: ""            # generated on first run when empty
ascender_pg_max_connections: 1024

# --- Paths and accounts (the application hard-codes most of these) -------------
ascender_user: awx
ascender_group: awx
ascender_home: /var/lib/awx
ascender_src_dir: /var/lib/awx/src
ascender_venv_base: /var/lib/awx/venv
ascender_venv: /var/lib/awx/venv/awx
ascender_config_dir: /etc/tower
ascender_secrets_dir: /etc/tower/.secrets
ascender_cert_dir: /etc/tower/certs
ascender_log_dir: /var/log/tower
ascender_run_dir: /run/ascender     # supervisord socket, receptor socket, pids
ascender_rsyslog_run_dir: /run/awx-rsyslog   # path is hard-coded in the app's logging config
# Subordinate uid/gid range for rootless podman (the jobs run in it). The awx
# account is a system user, so useradd gives it none; the role picks the first
# free range above every entry already in /etc/subuid and /etc/subgid, never
# below ascender_subid_min. Set ascender_subid_start to pin the start. An
# existing awx entry is kept. Either way the play fails, with instructions, if
# the range overlaps another account's.
ascender_subid_min: 100000
ascender_subid_count: 65536
# ascender_subid_start: 300000
