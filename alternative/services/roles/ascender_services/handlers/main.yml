---
# Skipped when the play stopped the service for an upgrade: it was started
# fresh on the new code and configuration by the services role.
- name: restart ascender
  ansible.builtin.systemd:
    name: ascender
    state: restarted
    daemon_reload: true
  when: not (ascender_stopped_for_upgrade | default(false))

- name: reload nginx
  ansible.builtin.systemd:
    name: nginx
    state: reloaded
