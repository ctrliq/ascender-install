# containers.conf for the podman that runs job containers inside the receptor
# sidecar (rootless, nested in a privileged container). Namespaces are shared
# with the sidecar and cgroups are left to the outer runtime.
[containers]
netns="host"
userns="host"
ipcns="host"
utsns="host"
cgroupns="host"
cgroups="disabled"
log_driver = "k8s-file"
# Do not give job containers their own SELinux MCS categories: the job's
# private data dir is shared with the task container, which must be able to
# read and write the files the job writes there. The sidecar is privileged
# (unconfined) already, so labeling here adds nothing.
label = false
[engine]
cgroup_manager = "cgroupfs"
events_logger="file"
runtime="crun"
