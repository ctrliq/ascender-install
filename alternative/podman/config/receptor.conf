# Receptor configuration for the execution sidecar. Also mounted read-only into
# the task container, which reads only the control-service filename from it.
#
# There is deliberately no `id` under `node`: receptor then uses the container
# hostname, which is the pod's hostname (ASCENDER_NODE_NAME, set by
# manage-containers.sh) and so the same as the task container's, i.e. the
# Instance name Ascender registered.
---
- node: {}

- log-level: info

# Listener for remote execution/hop nodes to peer into. Not published on the
# host unless you add a port mapping to the pod in manage-containers.sh; add
# TLS before doing so.
- tcp-listener:
    port: 27199

- control-service:
    service: control
    filename: /var/run/ascender-receptor/receptor.sock
    permissions: "0660"

# Runs jobs handed over by the task container. ansible-runner starts each job
# in a podman container from the job's execution environment image.
- work-command:
    worktype: local
    command: ansible-runner
    params: worker
    allowruntimeparams: true
