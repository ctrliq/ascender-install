# ASCENDER_HTTP_MODE=insecure: serve the UI and API over plain http as well.
# settings.py then drops the Secure flag from the session and CSRF cookies,
# for every client, including https ones.
add_header X-Content-Type-Options nosniff;
add_header X-Frame-Options "DENY";
add_header Content-Security-Policy "frame-ancestors 'none'";

include /etc/nginx/ascender-locations.conf;
