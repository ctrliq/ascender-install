# nginx for the Ascender web container (runs unprivileged as uid 1000).
# Listens on 8052 (http) and 8053 (https); docker-compose.yml maps these to
# the host ports. Modeled on the operator's nginx.conf.

worker_processes  1;
pid        /tmp/nginx.pid;
error_log  /dev/stderr warn;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';
    access_log  /dev/stdout  main;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    sendfile        on;

    upstream uwsgi {
        server 127.0.0.1:8050;
    }

    upstream daphne {
        server 127.0.0.1:8051;
    }

    server {
        listen 8052 default_server;
        server_name _;
        keepalive_timeout 65;

        # ascender-http.conf is either nginx-http-redirect.conf (301 to https,
        # the default) or nginx-http-insecure.conf (serve the UI over plain
        # http), selected by ASCENDER_HTTP_MODE at deploy time.
        include /etc/nginx/ascender-http.conf;
    }

    server {
        listen 8053 default_server ssl http2;
        server_name _;
        keepalive_timeout 65;

        ssl_certificate /etc/tower/certs/ascender.crt;
        ssl_certificate_key /etc/tower/certs/ascender.key;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
        ssl_prefer_server_ciphers on;

        # HSTS (15768000 seconds = 6 months)
        add_header Strict-Transport-Security max-age=15768000;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options "DENY";
        add_header Content-Security-Policy "frame-ancestors 'none'";

        include /etc/nginx/ascender-locations.conf;
    }
}
