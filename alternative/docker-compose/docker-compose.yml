# Ascender on Docker Compose
#
# Runs the same set of containers the Kubernetes deployment runs, on a single
# Docker host, from the published images:
#
#   web       nginx + uwsgi + daphne              ghcr.io/ctrliq/ascender
#   task      dispatcher, callback receiver, ws   ghcr.io/ctrliq/ascender
#   rsyslog   external log forwarder              ghcr.io/ctrliq/ascender
#   receptor  execution sidecar (receptor+podman) ghcr.io/ctrliq/ascender + receptor,
#                                                 built locally from ./receptor
#   valkey    cache / channel layer               ghcr.io/valkey-io/valkey
#   postgres  database                            quay.io/sclorg/postgresql-15-c9s
#
# Jobs run in podman containers (the ascender-ee image) inside the receptor
# sidecar, exactly as they do on a hybrid node. Copy .env.example to .env or
# run ./setup.sh, then `docker compose up -d`. See README.md.

name: ascender

x-ascender-image: &ascender-image
  image: ${ASCENDER_IMAGE:-ghcr.io/ctrliq/ascender}:${ASCENDER_VERSION:-latest}

x-ascender-env: &ascender-env
  ASCENDER_LOGGING_MODE: stdout
  ASCENDER_HOSTNAME: ${ASCENDER_HOSTNAME:-localhost}
  ASCENDER_ALLOWED_HOSTS: ${ASCENDER_ALLOWED_HOSTS:-}
  ASCENDER_HTTP_PORT: ${ASCENDER_HTTP_PORT:-80}
  ASCENDER_HTTPS_PORT: ${ASCENDER_HTTPS_PORT:-443}
  ASCENDER_HTTP_MODE: ${ASCENDER_HTTP_MODE:-redirect}
  DATABASE_HOST: ${ASCENDER_PGSQL_HOST:-postgres}
  DATABASE_PORT: ${ASCENDER_PGSQL_PORT:-5432}
  DATABASE_NAME: ${ASCENDER_PGSQL_DB:-ascender}
  DATABASE_USER: ${ASCENDER_PGSQL_USER:-ascender}
  DATABASE_PASSWORD: ${ASCENDER_PGSQL_PWD:?ASCENDER_PGSQL_PWD is not set; copy .env.example to .env or run ./setup.sh}
  BROADCAST_WEBSOCKET_SECRET: ${ASCENDER_WEBSOCKET_SECRET:?ASCENDER_WEBSOCKET_SECRET is not set; copy .env.example to .env or run ./setup.sh}

# awx/settings/defaults.py reads /etc/tower/SECRET_KEY and derives the channel
# layer (websocket event) encryption key from it, so every Ascender container
# must see the same file. It is delivered as a compose secret from .env.
x-ascender-secrets: &ascender-secrets
  - source: ascender_secret_key
    target: /etc/tower/SECRET_KEY
    uid: "1000"
    gid: "0"
    mode: 0440

services:

  postgres:
    image: ${POSTGRES_IMAGE:-quay.io/sclorg/postgresql-15-c9s}
    # Optional service: disabled when COMPOSE_PROFILES drops "bundled-db"
    # (external database). bootstrap.sh waits for DATABASE_HOST regardless.
    profiles: ["bundled-db"]
    # Logging options: https://www.postgresql.org/docs/current/runtime-config-logging.html
    command: run-postgresql -c max_connections=${POSTGRES_MAX_CONNECTIONS:-1024} -c log_destination=stderr
    environment:
      POSTGRESQL_USER: ${ASCENDER_PGSQL_USER:-ascender}
      POSTGRESQL_PASSWORD: ${ASCENDER_PGSQL_PWD}
      POSTGRESQL_DATABASE: ${ASCENDER_PGSQL_DB:-ascender}
    volumes:
      - postgres_data:/var/lib/pgsql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -q -h 127.0.0.1 -U $${POSTGRESQL_USER} -d $${POSTGRESQL_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  valkey:
    image: ${VALKEY_IMAGE:-ghcr.io/valkey-io/valkey:9-alpine}
    # Bypass the image entrypoint so valkey runs as root: the socket then belongs
    # to root:root 0770 and the Ascender processes (uid 1000, gid 0) can use it.
    entrypoint: ["valkey-server"]
    command: ["/usr/local/etc/valkey/valkey.conf"]
    volumes:
      - ./config/valkey.conf:/usr/local/etc/valkey/valkey.conf:ro
      - valkey_socket:/var/run/valkey
    healthcheck:
      test: ["CMD", "valkey-cli", "-s", "/var/run/valkey/valkey.sock", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # One-shot, runs as root: gives the shared volumes the ownership the
  # unprivileged (uid 1000, gid 0) service containers need. The k8s pod does
  # the same thing with fsGroup / an init container.
  init:
    <<: *ascender-image
    user: "0:0"
    entrypoint: ["/bin/bash"]
    command: ["/opt/ascender/init.sh"]
    volumes:
      - ./scripts:/opt/ascender:ro
      - projects:/var/lib/awx/projects
      - job_private_data:/tmp
      - receptor_socket:/var/run/awx-receptor
      - rsyslog_socket:/var/run/awx-rsyslog
      - podman_storage:/var/lib/awx/.local/share/containers
    restart: "no"

  # One-shot: waits for the database, applies migrations, creates/updates the
  # admin user, loads the preload data and registers the default execution
  # environments. Equivalent to the operator's migration and admin-user jobs.
  migrate:
    <<: *ascender-image
    user: "1000:0"
    entrypoint: ["dumb-init", "--", "/bin/bash"]
    command: ["/opt/ascender/bootstrap.sh"]
    environment:
      <<: *ascender-env
      ASCENDER_ADMIN_USER: ${ASCENDER_ADMIN_USER:-admin}
      ASCENDER_ADMIN_PASSWORD: ${ASCENDER_ADMIN_PASSWORD:?ASCENDER_ADMIN_PASSWORD is not set; copy .env.example to .env or run ./setup.sh}
      ASCENDER_ADMIN_EMAIL: ${ASCENDER_ADMIN_EMAIL:-admin@example.com}
    volumes:
      - ./scripts:/opt/ascender:ro
      - ./config/settings.py:/etc/tower/settings.py:ro
      - ./config/receptor.conf:/etc/receptor/receptor.conf:ro
      - valkey_socket:/var/run/valkey
    secrets: *ascender-secrets
    # No dependency on postgres: it is optional (profile "bundled-db") and
    # bootstrap.sh waits for DATABASE_HOST itself.
    depends_on:
      valkey:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    restart: "no"

  web:
    <<: *ascender-image
    # All Ascender containers share one hostname, as containers in the k8s pod
    # do: it is the Instance name, and it lets the web node read job events
    # straight from valkey instead of through the task's websocket relay.
    hostname: ${ASCENDER_NODE_NAME:-ascender-task}
    user: "1000:0"
    command: launch_awx_web.sh
    environment:
      <<: *ascender-env
      # ascender-manage reload/restart helpers call supervisorctl with this config.
      SUPERVISOR_CONFIG_PATH: /etc/supervisord_web.conf
    volumes:
      - ./config/settings.py:/etc/tower/settings.py:ro
      - ./config/receptor.conf:/etc/receptor/receptor.conf:ro
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx-locations.conf:/etc/nginx/ascender-locations.conf:ro
      - ./config/nginx-http-${ASCENDER_HTTP_MODE:-redirect}.conf:/etc/nginx/ascender-http.conf:ro
      - ./certs:/etc/tower/certs:ro
      - projects:/var/lib/awx/projects
      - valkey_socket:/var/run/valkey
      - rsyslog_socket:/var/run/awx-rsyslog
    ports:
      - "${ASCENDER_HTTP_PORT:-80}:8052"
      - "${ASCENDER_HTTPS_PORT:-443}:8053"
    secrets: *ascender-secrets
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -kfsS -o /dev/null https://127.0.0.1:8053/api/v2/ping/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  task:
    <<: *ascender-image
    # This is the Instance name Ascender registers and shows in the UI.
    hostname: ${ASCENDER_NODE_NAME:-ascender-task}
    user: "1000:0"
    command: /opt/ascender/launch_task.sh
    environment:
      <<: *ascender-env
      # ascender-manage reload/restart helpers call supervisorctl with this config.
      SUPERVISOR_CONFIG_PATH: /etc/supervisord_task.conf
      # Convenience for `docker compose exec task receptorctl status`. The
      # dispatcher itself reads the socket path from receptor.conf.
      RECEPTORCTL_SOCKET: /var/run/awx-receptor/receptor.sock
    volumes:
      - ./scripts:/opt/ascender:ro
      - ./config/settings.py:/etc/tower/settings.py:ro
      - ./config/receptor.conf:/etc/receptor/receptor.conf:ro
      - projects:/var/lib/awx/projects
      - job_private_data:/tmp
      - valkey_socket:/var/run/valkey
      - receptor_socket:/var/run/awx-receptor
      - rsyslog_socket:/var/run/awx-rsyslog
    secrets: *ascender-secrets
    depends_on:
      migrate:
        condition: service_completed_successfully
      receptor:
        condition: service_started
    restart: unless-stopped

  rsyslog:
    <<: *ascender-image
    hostname: ${ASCENDER_NODE_NAME:-ascender-task}
    user: "1000:0"
    command: launch_awx_rsyslog.sh
    environment:
      <<: *ascender-env
      # ascender-manage reload/restart helpers call supervisorctl with this config.
      SUPERVISOR_CONFIG_PATH: /etc/supervisord_rsyslog.conf
    volumes:
      - ./config/settings.py:/etc/tower/settings.py:ro
      - ./config/receptor.conf:/etc/receptor/receptor.conf:ro
      - valkey_socket:/var/run/valkey
      - rsyslog_socket:/var/run/awx-rsyslog
      - rsyslog_spool:/var/lib/awx/rsyslog
    secrets: *ascender-secrets
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # The docker equivalent of the awx-ee sidecar in the k8s pod: runs receptor,
  # which the task container reaches over the shared control socket, and
  # executes jobs with `ansible-runner worker`, which starts each job in a
  # podman container from its execution environment image. Rootless podman
  # inside a container needs the privileged flag (same as the dev environment).
  receptor:
    image: ${ASCENDER_RECEPTOR_IMAGE:-ghcr.io/ctrliq/ascender-receptor}:${ASCENDER_VERSION:-latest}
    pull_policy: missing
    build:
      context: ./receptor
      args:
        ASCENDER_IMAGE: ${ASCENDER_IMAGE:-ghcr.io/ctrliq/ascender}
        ASCENDER_VERSION: ${ASCENDER_VERSION:-latest}
        RECEPTOR_IMAGE: ${RECEPTOR_IMAGE:-quay.io/ansible/receptor:v1.6.8}
    # Receptor takes its node id from the hostname; it must match the Instance
    # name the task container registered.
    hostname: ${ASCENDER_NODE_NAME:-ascender-task}
    user: "1000:0"
    privileged: true
    environment:
      RECEPTORCTL_SOCKET: /var/run/awx-receptor/receptor.sock
      XDG_RUNTIME_DIR: /run/user/1000
    # Runtime state of the nested podman: a fresh tmpfs per container start,
    # never the shared /tmp volume (see receptor/launch_awx_receptor.sh).
    tmpfs:
      - /run/user/1000:uid=1000,gid=0,mode=0700
    volumes:
      - ./config/receptor.conf:/etc/receptor/receptor.conf:ro
      - projects:/var/lib/awx/projects
      - job_private_data:/tmp
      - receptor_socket:/var/run/awx-receptor
      - podman_storage:/var/lib/awx/.local/share/containers
      - /sys/fs/cgroup:/sys/fs/cgroup
    # Uncomment to let remote execution / hop nodes peer into this node.
    # ports:
    #   - "${ASCENDER_RECEPTOR_PORT:-27199}:27199"
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

secrets:
  ascender_secret_key:
    environment: ASCENDER_SECRET_KEY

volumes:
  postgres_data:
  projects:            # /var/lib/awx/projects   shared by web, task, receptor
  job_private_data:    # /tmp                    job private data dirs: task + receptor
  receptor_socket:     # /var/run/awx-receptor   task -> receptor control socket
  rsyslog_socket:      # /var/run/awx-rsyslog    web, task -> rsyslog
  valkey_socket:       # /var/run/valkey
  rsyslog_spool:
  podman_storage:      # execution environment images pulled by podman
