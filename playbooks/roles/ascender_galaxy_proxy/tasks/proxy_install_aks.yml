- name: Retrieve the current time in order to timestamp files
  ansible.builtin.setup:
    gather_subset:
     - date_time

- name: Generate manifest to install proxy k8s object with timestamp attached, for purposes of deletion later
  ansible.builtin.template:
    src: proxy_deployment_aks.yml
    dest: "{{ tmp_dir }}/proxy_deployment_aks.yml.{{ ansible_date_time.iso8601_basic_short }}"

- name: "Apply proxy manifest for {{ k8s_platform }}"
  kubernetes.core.k8s:
    state: present
    namespace: "{{ ASCENDER_NAMESPACE }}"
    definition: "{{ lookup('template', 'templates/proxy_deployment_aks.yml') | from_yaml_all }}"
    verify_ssl: false
  register: proxy_apply_result

- name: Wait for Proxy Deployment to complete setting up
  kubernetes.core.k8s_info:
    kind: Deployment
    wait: yes
    name: ascender-galaxy-proxy
    namespace: "{{ ASCENDER_NAMESPACE }}"
    wait_sleep: 10
    wait_timeout: 360
    verify_ssl: false
     
- name: Restart Proxy deployments to pull latest image
  kubernetes.core.k8s:
    state: present
    api_version: apps/v1
    kind: Deployment
    name: "ascender-galaxy-proxy"
    namespace: "{{ ASCENDER_NAMESPACE }}"
    definition:
      spec:
        template:
          metadata:
            annotations:
              kubectl.kubernetes.io/restartedAt: "{{ ansible_date_time.iso8601 }}"
    merge_type:
      - strategic-merge
    verify_ssl: false
  when:
    - PROXY_VERSION | lower == "latest"
    - not proxy_apply_result.changed

- name: Retrieve the ascender-galaxy-proxy Ingress object
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Ingress
    name: ascender-galaxy-proxy
    namespace: "{{ ASCENDER_NAMESPACE }}"
  register: proxy_ingress
  until:
    - proxy_ingress.resources[0].status.loadBalancer.ingress[0].ip is defined
    - proxy_ingress.resources[0].spec.rules[0].host is defined
  retries: 20

- ansible.builtin.debug: 
    var: proxy_ingress.resources[0].status.loadBalancer.ingress[0].ip

- ansible.builtin.debug: 
    var: proxy_ingress.resources[0].spec.rules[0].host

- name: List all DNS zones
  azure.azcollection.azure_rm_dnszone_info:
  register: all_zones
  when: USE_AZURE_DNS

- ansible.builtin.debug:
    var: all_zones
  when: USE_AZURE_DNS

- name: Set Resource Group Fact
  ansible.builtin.set_fact:
    resource_group: "{{ item.id.split('/')[4] }}"
  loop: "{{ all_zones.ansible_info.azure_dnszones }}"
  when: 
    - USE_AZURE_DNS
    - item.name == ASCENDER_DOMAIN

- ansible.builtin.debug:
    var: resource_group
  when: USE_AZURE_DNS

- name: create A record set with metadata information
  azure.azcollection.azure_rm_dnsrecordset:
    resource_group: "{{ resource_group }}"
    relative_name: "{{ ASCENDER_NAMESPACE }}"
    zone_name: "{{ ASCENDER_DOMAIN }}"
    record_type: A
    records:
      - entry: "{{ proxy_ingress.resources[0].status.loadBalancer.ingress[0].ip }}"
  when: USE_AZURE_DNS

- name: Indicate Instructions for non-AzureDNS Domain Management
  ansible.builtin.debug: 
    msg: "Please manually create a DNS A record for {{ PROXY_HOSTNAME }} in your DNS Record Manager of choice, mapping to {{ proxy_ingress.resources[0].status.loadBalancer.ingress[0].ip }}"
  when: not USE_AZURE_DNS

- ansible.builtin.debug:
    msg: "The Proxy endpoint is {{ k8s_lb_protocol }}://{{ PROXY_HOSTNAME }}"

- name: Wait until Proxy endpoint is Up
  ansible.builtin.uri:
    url: "{{ k8s_lb_protocol }}://{{ PROXY_HOSTNAME }}/healthz"
    return_content: yes
    validate_certs: false
    status_code:
      - 200
  until: uri_output.status == 200
  retries: 200
  delay: 10
  register: uri_output

- ansible.builtin.debug:
    msg: "Proxy endpoint is up"
