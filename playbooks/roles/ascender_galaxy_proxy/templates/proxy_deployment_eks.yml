---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ascender-galaxy-proxy-config
  namespace: {{ ASCENDER_NAMESPACE }}
data:
  # Enable debug logging.
  DEBUG: "{{ PROXY_CONFIG.DEBUG | default('false') }}"
  # Cache API responses for this many days.
  QUERY_CACHE_EXPIRE: "{{ PROXY_CONFIG.QUERY_CACHE_EXPIRE | default('1') }}"
  # Cache artifact downloads for this many days.
  ARTIFACT_CACHE_EXPIRE: "{{ PROXY_CONFIG.ARTIFACT_CACHE_EXPIRE | default('30') }}"
  # Comma-separated trusted proxy IPs.
  TRUSTED_PROXIES: "{{ PROXY_CONFIG.TRUSTED_PROXIES | default('') }}"
  # Public proxy URL used in rewritten links.
  URL: "{{ PROXY_CONFIG.URL | default('https://galaxy-proxy.example.com') }}"
  # Upstream Galaxy server to proxy requests to.
  UPSTREAM_BASEURL: "{{ PROXY_CONFIG.UPSTREAM_BASEURL | default('https://galaxy.ansible.com') }}"
  # Clear the on-disk cache when the app starts.
  CLEAR_CACHE_ON_START: "{{ PROXY_CONFIG.CLEAR_CACHE_ON_START | default('0') }}"
  # Max number of responses kept in memory.
  MEM_CACHE_SIZE: "{{ PROXY_CONFIG.MEM_CACHE_SIZE | default('2000') }}"
  # Optional outbound HTTP proxy for upstream calls.
  HTTP_PROXY: "{{ PROXY_CONFIG.HTTP_PROXY | default('') }}"
  # Token required for API authentication.
  GALAXY_API_TOKEN: "{{ PROXY_CONFIG.GALAXY_API_TOKEN | default('') }}"
---
# If you prefer ephemeral cache storage, replace this PVC with emptyDir.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ascender-galaxy-proxy-cache
  namespace: {{ ASCENDER_NAMESPACE }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ PROXY_CONFIG.PVC_SIZE | default('5') }}Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ascender-galaxy-proxy
  namespace: {{ ASCENDER_NAMESPACE }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ascender-galaxy-proxy
  template:
    metadata:
      labels:
        app: ascender-galaxy-proxy
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ascender-galaxy-proxy
          image: {{ PROXY_IMAGE }}:{{ PROXY_VERSION }}
          imagePullPolicy: {{ ascender_image_pull_policy | default("Always") }}
          args:
            - --port=80
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          envFrom:
            - configMapRef:
                name: ascender-galaxy-proxy-config
          volumeMounts:
            - name: cache
              mountPath: /app/.cache
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 2
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            capabilities:
              drop:
                - ALL
      volumes:
        - name: cache
          persistentVolumeClaim:
            claimName: ascender-galaxy-proxy-cache
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: ascender-galaxy-proxy
  namespace: {{ ASCENDER_NAMESPACE }}
spec:
  type: ClusterIP
  selector:
    app: ascender-galaxy-proxy
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/load-balancer-name: "{{ EKS_CLUSTER_NAME }}-proxy"
    alb.ingress.kubernetes.io/scheme: "{{ 'internet-facing' if EKS_PUBLIC else 'internal' }}"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/success-codes: "200,302"
    alb.ingress.kubernetes.io/certificate-arn: "{{ certificate.certificate_arn }}"
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/ssl-policy: "{{ EKS_SSL_POLICY }}"
    alb.ingress.kubernetes.io/inbound-cidrs: "{{ EKS_ALB_INBOUND_CIDRS | join(',') }}"
{% if EKS_ALB_SECURITY_GROUPS is defined %}
    alb.ingress.kubernetes.io/security-groups: "{{ EKS_ALB_SECURITY_GROUPS }}"
    alb.ingress.kubernetes.io/manage-backend-security-group-rules: "true"
{% endif %}
  name: ascender-galaxy-proxy
  namespace: {{ ASCENDER_NAMESPACE }}
spec:
  rules:
  - host: {{ PROXY_HOSTNAME }}
    http:
      paths:
      - backend:
          service:
            name: ascender-galaxy-proxy
            port:
              number: 80
        path: /
        pathType: Prefix
  tls:
  - hosts:
    - {{ PROXY_HOSTNAME }}