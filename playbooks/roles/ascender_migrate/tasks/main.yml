
# A failed earlier run can leave the operator scaled to 0, and the backup below
# needs it running.
- name: Ensure Ascender Operator is running
  kubernetes.core.k8s_scale:
    namespace: "{{ ASCENDER_NAMESPACE }}"
    kind: Deployment
    name: awx-operator-controller-manager
    replicas: 1
    wait: true
    wait_timeout: 180
    verify_ssl: false

- name: Remove restore if exists
  kubernetes.core.k8s:
    state: absent
    definition:
      apiVersion: awx.ansible.com/v1beta1
      kind: AWXRestore
      metadata:
        name: ascender-app-restore
        namespace: "{{ ASCENDER_NAMESPACE }}"
    wait: true
    verify_ssl: false

- name: Take backup of the current database
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: awx.ansible.com/v1beta1
      kind: AWXBackup
      metadata:
        name: ascender-app-backup
        namespace: "{{ ASCENDER_NAMESPACE }}"
      spec:
        deployment_name: ascender-app
    verify_ssl: false
    wait: true

- name: Get backup information
  kubernetes.core.k8s_info:
    api_version: awx.ansible.com/v1beta1
    kind: AWXBackup
    name: ascender-app-backup
    namespace: "{{ ASCENDER_NAMESPACE }}"
    verify_ssl: false
    wait: true
  register: backup_info
  until: backup_info.resources[0].status.backupDirectory is defined
  retries: 30
  delay: 10

- name: Set backup directory fact
  ansible.builtin.set_fact:
    backup_directory: "{{ backup_info.resources[0].status.backupDirectory }}"
    backup_pvc: "{{ backup_info.resources[0].status.backupClaim }}"

- name: Display backup directory
  ansible.builtin.debug:
    msg: "Backup directory: {{ backup_directory }}"

- name: Display backup PVC
  ansible.builtin.debug:
    msg: "Backup PVC: {{ backup_pvc }}"

- name: Remove existing temporary pod if present
  kubernetes.core.k8s:
    state: absent
    api_version: v1
    kind: Pod
    name: temp-copy-pod
    namespace: "{{ ASCENDER_NAMESPACE }}"
    verify_ssl: false

- name: Create a temporary pod to mount the PVC
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Pod
      metadata:
        name: temp-copy-pod
        namespace: "{{ ASCENDER_NAMESPACE }}"
      spec:
        volumes:
          - name: pvc-storage
            persistentVolumeClaim:
              claimName: "{{ backup_pvc }}"
        containers:
          - name: busybox-container
            image: busybox:stable
            command: ["sleep", "infinity"]
            volumeMounts:
              - name: pvc-storage
                mountPath: "/backups"
        restartPolicy: Never
    wait: true
    wait_timeout: 180
    verify_ssl: false
  register: create_pod_result

- name: Wait for the temporary pod to be ready
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    name: temp-copy-pod
    namespace: "{{ ASCENDER_NAMESPACE }}"
    wait: true
    wait_condition:
      type: Ready
      status: "True"
    wait_timeout: 120
    verify_ssl: false

- name: Clean up old migration directory in PVC
  kubernetes.core.k8s_exec:
    namespace: "{{ ASCENDER_NAMESPACE }}"
    pod: temp-copy-pod
    command: rm -fr /backups/awx_migration
    verify_ssl: false

- name: Create new directory in PVC for migration
  kubernetes.core.k8s_exec:
    namespace: "{{ ASCENDER_NAMESPACE }}"
    pod: temp-copy-pod
    command: mkdir /backups/awx_migration/
    impersonate_user: 26
    verify_ssl: false

- name: Copy the files
  kubernetes.core.k8s_exec:
    namespace: "{{ ASCENDER_NAMESPACE }}"
    pod: temp-copy-pod
    command: cp -p {{ backup_directory }}/{{ item }} /backups/awx_migration/
    impersonate_user: 26
    verify_ssl: false
  loop:
    - tower.db
    - secrets.yml
    - awx_object

- name: Copy the tower.db to the PVC
  kubernetes.core.k8s_cp:
    namespace: "{{ ASCENDER_NAMESPACE }}"
    pod: temp-copy-pod
    local_path: "{{ local_file_path }}/tower.db"
    remote_path: "/backups/awx_migration/tower.db"
    state: to_pod
    verify_ssl: false

- name: load secrets.yml from backup
  ansible.builtin.set_fact:
    old_secrets: "{{ lookup('file', local_file_path + '/secrets.yml') | ansible.builtin.from_yaml }}"

- name: load secrets.yml from backup
  ansible.builtin.set_fact:
    old_secret_key: "{{ old_secrets.secrets.secretKeySecret.data.secret_key }}"

- name: Copy secrets from PVC
  kubernetes.core.k8s_cp:
    namespace: "{{ ASCENDER_NAMESPACE }}"
    pod: temp-copy-pod
    local_path: "{{ local_file_path }}/secrets.new.yml"
    remote_path: "/{{ backup_directory }}/secrets.yml"
    state: from_pod
    verify_ssl: false

- name: load secrets.yml from backup
  ansible.builtin.set_fact:
    new_secrets: "{{ lookup('file', local_file_path + '/secrets.new.yml') | ansible.builtin.from_yaml }}"

- name: load secrets.yml from backup
  ansible.builtin.set_fact:
    new_secret_key: "{{ new_secrets.secrets.secretKeySecret.data.secret_key }}"

- name: Create updated secrets.yml file
  ansible.builtin.set_fact:
    updated_secrets: "{{ lookup('file', local_file_path + '/secrets.new.yml') | replace(new_secret_key, old_secret_key) }}"

- name: Copy new secrets to PVC
  kubernetes.core.k8s_cp:
    namespace: "{{ ASCENDER_NAMESPACE }}"
    pod: temp-copy-pod
    remote_path: "/backups/awx_migration/secrets.yml"
    content: "{{ updated_secrets }}"
    state: to_pod
    verify_ssl: false

- name: Fix permissions on copied files
  kubernetes.core.k8s_exec:
    namespace: "{{ ASCENDER_NAMESPACE }}"
    pod: temp-copy-pod
    command: chmod 777 /backups/awx_migration/{{ item }}
    verify_ssl: false
  loop:
    - tower.db
    - secrets.yml
    - awx_object

- name: Fix ownership on copied files
  kubernetes.core.k8s_exec:
    namespace: "{{ ASCENDER_NAMESPACE }}"
    pod: temp-copy-pod
    command: chown 26:26 /backups/awx_migration/{{ item }}
    verify_ssl: false
  loop:
    - tower.db
    - secrets.yml
    - awx_object

- name: Clean up and delete the temporary pod
  kubernetes.core.k8s:
    state: absent
    definition:
      apiVersion: v1
      kind: Pod
      metadata:
        name: temp-copy-pod
        namespace: "{{ ASCENDER_NAMESPACE }}"
    verify_ssl: false

- name: Scale down Ascender pods
  kubernetes.core.k8s_scale:
    namespace: "{{ ASCENDER_NAMESPACE }}"
    kind: Deployment
    name: "{{ item }}"
    replicas: 0
    wait: true
    wait_timeout: 180
    verify_ssl: false
  loop:
    - awx-operator-controller-manager
    - ascender-app-task
    - ascender-app-web

- name: Scale down Ascender Postgres StatefulSet
  kubernetes.core.k8s_scale:
    namespace: "{{ ASCENDER_NAMESPACE }}"
    kind: StatefulSet
    name: ascender-app-postgres-15
    replicas: 0
    wait: true
    wait_timeout: 180
    verify_ssl: false

- name: Delete PVC for Postgres
  kubernetes.core.k8s:
    state: absent
    kind: PersistentVolumeClaim
    name: postgres-15-ascender-app-postgres-15-0
    namespace: "{{ ASCENDER_NAMESPACE }}"
    wait: true

- name: Scale up Ascender Postgres StatefulSet
  kubernetes.core.k8s_scale:
    namespace: "{{ ASCENDER_NAMESPACE }}"
    kind: StatefulSet
    name: ascender-app-postgres-15
    replicas: 1
    wait: true
    wait_timeout: 180
    verify_ssl: false

- name: Restore the backup
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: awx.ansible.com/v1beta1
      kind: AWXRestore
      metadata:
        name: ascender-app-restore
        namespace: "{{ ASCENDER_NAMESPACE }}"
      spec:
        deployment_name: ascender-app
        backup_pvc_namespace: "{{ ASCENDER_NAMESPACE }}"
        backup_pvc: "{{ backup_pvc }}"
        backup_dir: /backups/awx_migration
        no_log: false
        #force_drop_db: true
    verify_ssl: false

- name: Scale up Ascender Operator
  kubernetes.core.k8s_scale:
    namespace: "{{ ASCENDER_NAMESPACE }}"
    kind: Deployment
    name: "{{ item }}"
    replicas: 1
    wait: true
    wait_timeout: 180
    verify_ssl: false
  loop:
    - awx-operator-controller-manager

# The operator only processes the AWXRestore once it is scaled back up. Wait
# for it to finish, or the steps below run against the empty database.
- name: Wait for the restore to complete
  kubernetes.core.k8s_info:
    api_version: awx.ansible.com/v1beta1
    kind: AWXRestore
    name: ascender-app-restore
    namespace: "{{ ASCENDER_NAMESPACE }}"
    verify_ssl: false
  register: restore_info
  until: >-
    restore_info.resources | length > 0 and
    restore_info.resources[0].status.restoreComplete | default(false) | bool
  retries: 120
  delay: 15

# Keep the operator from reconciling while the steps below fix up the migration
# history. It is scaled back up once the migrations are done.
- name: Scale down Ascender Operator during migrations
  kubernetes.core.k8s_scale:
    namespace: "{{ ASCENDER_NAMESPACE }}"
    kind: Deployment
    name: awx-operator-controller-manager
    replicas: 0
    wait: true
    wait_timeout: 180
    verify_ssl: false

# The operator may already have started its own migration Job against the
# restored AWX database. Remove it so it cannot run alongside the steps below.
- name: Find operator migration Jobs
  kubernetes.core.k8s_info:
    kind: Job
    namespace: "{{ ASCENDER_NAMESPACE }}"
    verify_ssl: false
  register: migration_jobs

- name: Delete operator migration Jobs
  kubernetes.core.k8s:
    state: absent
    kind: Job
    name: "{{ item }}"
    namespace: "{{ ASCENDER_NAMESPACE }}"
    delete_options:
      propagationPolicy: Foreground
    wait: true
    wait_timeout: 300
    verify_ssl: false
  loop: >-
    {{ migration_jobs.resources | map(attribute='metadata.name')
       | select('match', 'ascender-app-migration-') | list }}

# The web deployment was scaled to 0 above and the operator is now down, so
# bring up one web pod to run the migrations in.
- name: Scale up Ascender web deployment for migrations
  kubernetes.core.k8s_scale:
    namespace: "{{ ASCENDER_NAMESPACE }}"
    kind: Deployment
    name: ascender-app-web
    replicas: 1
    wait: false
    verify_ssl: false

- name: Check whether the restored database reached AWX migration {{ awx_migration_marker }}
  kubernetes.core.k8s_exec:
    namespace: "{{ ASCENDER_NAMESPACE }}"
    pod: ascender-app-postgres-15-0
    command: >-
      psql -U awx -tAc "select count(*) from django_migrations
      where app = 'main' and name = '{{ awx_migration_marker }}';"
    verify_ssl: false
  register: awx_marker_check
  until: awx_marker_check.rc is defined and awx_marker_check.rc == 0
  retries: 30
  delay: 10

- name: Fail if the AWX database is too old for this migration
  ansible.builtin.fail:
    msg: >-
      The restored database has not reached AWX migration {{ awx_migration_marker }}
      (AWX 23.9 or later), so it cannot be migrated to Ascender by this playbook.
      Upgrade AWX first (24.6.1 is the final AWX release), take a new backup and
      run this playbook again. The Ascender operator is left scaled to 0.
  when: awx_marker_check.stdout | trim | int == 0

- name: Clean up migration records and DAB RBAC data
  kubernetes.core.k8s_exec:
    namespace: "{{ ASCENDER_NAMESPACE }}"
    pod: ascender-app-postgres-15-0
    command: "bash -c {{ lookup('template', awx_migrate_templates ~ '/migration_fix.sh.j2') | quote }}"
    verify_ssl: false

- name: Wait for a running Ascender web pod
  kubernetes.core.k8s_info:
    namespace: "{{ ASCENDER_NAMESPACE }}"
    kind: Pod
    label_selectors:
      - "app.kubernetes.io/name = ascender-app-web"
    field_selectors:
      - status.phase=Running
    verify_ssl: false
  register: web_pods
  until: web_pods.resources | rejectattr('metadata.deletionTimestamp', 'defined') | list | length > 0
  retries: 60
  delay: 20

- ansible.builtin.set_fact:
    web_pod: "{{ (web_pods.resources | rejectattr('metadata.deletionTimestamp', 'defined') | first).metadata.name }}"

# The web readiness probe needs a migrated database, so wait for the container
# to accept commands instead of waiting for Ready.
- name: Wait for the web container to accept commands
  kubernetes.core.k8s_exec:
    namespace: "{{ ASCENDER_NAMESPACE }}"
    pod: "{{ web_pod }}"
    container: "ascender-app-web"
    command: "true"
    verify_ssl: false
  register: web_exec
  until: web_exec.rc is defined and web_exec.rc == 0
  retries: 30
  delay: 10

- name: Run Ascender migrations
  kubernetes.core.k8s_exec:
    namespace: "{{ ASCENDER_NAMESPACE }}"
    pod: "{{ web_pod }}"
    container: "ascender-app-web"
    command: "bash -c {{ lookup('template', awx_migrate_templates ~ '/awx_migrate.sh.j2') | quote }}"
    verify_ssl: false
  register: awx_migrate_result

- name: Show migration output
  ansible.builtin.debug:
    var: awx_migrate_result.stdout_lines

- name: Check for unapplied migrations
  kubernetes.core.k8s_exec:
    namespace: "{{ ASCENDER_NAMESPACE }}"
    pod: "{{ web_pod }}"
    container: "ascender-app-web"
    command: /bin/bash -ec "out=$(ascender-manage showmigrations); grep -F '[ ]' <<< \"$out\" || true"
    verify_ssl: false
  register: unapplied_migrations

- name: Fail if any migration is still unapplied
  ansible.builtin.fail:
    msg: "Migration did not complete. Unapplied migrations: {{ unapplied_migrations.stdout_lines }}"
  when: unapplied_migrations.stdout | trim | length > 0

- name: Scale up Ascender Operator after migrations
  kubernetes.core.k8s_scale:
    namespace: "{{ ASCENDER_NAMESPACE }}"
    kind: Deployment
    name: awx-operator-controller-manager
    replicas: 1
    wait: true
    wait_timeout: 180
    verify_ssl: false

- name: Remove restore if exists
  kubernetes.core.k8s:
    state: absent
    definition:
      apiVersion: awx.ansible.com/v1beta1
      kind: AWXRestore
      metadata:
        name: ascender-app-restore
        namespace: "{{ ASCENDER_NAMESPACE }}"
    verify_ssl: false
