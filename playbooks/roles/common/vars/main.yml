common_packages:
  RedHat:
    8:
      - jq
      - platform-python-setuptools
      - python3-pip
      - kubectl
      - python3-kubernetes
    9:
      - jq
      - python-setuptools
      - python3-pip
      - kubectl
      - python3-kubernetes
  Debian:
    11:
      - jq
      - python3-pip
      - python3-setuptools
      - kubectl
      - python3-kubernetes
    # curl/gnupg must be installed before the k8s keyring step: Debian cloud and
    # netinst images ship without them, and the keyring build is a curl | gpg
    # pipeline. They also can't live in common_packages, which includes kubectl —
    # a package that only exists once the k8s repo is in place.
    # Additionally, upstream provides no GPG keys for Debian 12/13, so we supply
    # them here to prevent a KeyError on online installs.
    12:
      - git
      - jq
      - curl
      - gnupg
      - ca-certificates
      - python3-pip
      - python3-setuptools
      - kubectl
      - python3-kubernetes
    13:
      - git
      - jq
      - curl
      - gnupg
      - ca-certificates
      - python3-pip
      - python3-setuptools
      - kubectl
      - python3-kubernetes
    24:
      - jq
      - python3-pip
      - python3-setuptools
      - kubectl
      - python3-kubernetes
    26:
      - jq
      - python3-pip
      - python3-setuptools
      - kubectl
      - python3-kubernetes

