- name: Prompt whether to install the Ascender Galaxy Proxy
  ansible.builtin.include_tasks: menu_choice.yml
  vars:
    config_vars_menu_prompt: "Boolean indicating whether to install the Ascender Galaxy Proxy:"
    config_vars_menu_options_display: "{{ config_vars_boolean_options_display }}"
    config_vars_menu_options_value: "{{ config_vars_boolean_options_value }}"
    config_vars_menu_target: PROXY_INSTALL
    config_vars_menu_default_display: "{{ config_data.PROXY_INSTALL | default(false) | bool | ternary('true', 'false') }}"
    config_vars_menu_default_value: "{{ config_data.PROXY_INSTALL | default(false) | bool }}"

- block:
    - name: "DNS resolvable hostname for the Ascender Galaxy Proxy"
      prompt:
        prompt: "Enter your selection [{{ config_data.PROXY_HOSTNAME | default('galaxy-proxy.example.com') }}]: "
      register: config_vars_proxy_hostname

    - name: Save the proxy hostname
      vars:
        proxy_hostname_default: "{{ config_data.PROXY_HOSTNAME | default('galaxy-proxy.example.com') }}"
        proxy_hostname_value: "{{ config_vars_proxy_hostname.user_input | trim | default(proxy_hostname_default, true) }}"
      ansible.builtin.set_fact:
        config_data: "{{ config_data | combine({'PROXY_HOSTNAME': proxy_hostname_value}, recursive=True) }}"

    - name: "The OCI container image for the Ascender Galaxy Proxy"
      prompt:
        prompt: "Enter your selection [{{ config_data.PROXY_IMAGE | default('ghcr.io/ctrliq/ascender-galaxy-proxy') }}]: "
      register: config_vars_proxy_image

    - name: Save the proxy image
      vars:
        proxy_image_default: "{{ config_data.PROXY_IMAGE | default('ghcr.io/ctrliq/ascender-galaxy-proxy') }}"
        proxy_image_value: "{{ config_vars_proxy_image.user_input | trim | default(proxy_image_default, true) }}"
      ansible.builtin.set_fact:
        config_data: "{{ config_data | combine({'PROXY_IMAGE': proxy_image_value}, recursive=True) }}"

    - name: "The image tag indicating the version of the Ascender Galaxy Proxy"
      prompt:
        prompt: "Enter your selection [{{ config_data.PROXY_VERSION | default('latest') }}]: "
      register: config_vars_proxy_version

    - name: Save the proxy version
      vars:
        proxy_version_default: "{{ config_data.PROXY_VERSION | default('latest') }}"
        proxy_version_value: "{{ config_vars_proxy_version.user_input | trim | default(proxy_version_default, true) }}"
      ansible.builtin.set_fact:
        config_data: "{{ config_data | combine({'PROXY_VERSION': proxy_version_value}, recursive=True) }}"

    - name: "Number of days to keep cached API query responses before expiring them"
      prompt:
        prompt: "Enter your selection [{{ config_data.PROXY_CONFIG.QUERY_CACHE_EXPIRE | default('1') }}]: "
      register: config_vars_proxy_query_cache_expire

    - name: Save the proxy query cache expiry
      vars:
        proxy_query_cache_expire_default: "{{ config_data.PROXY_CONFIG.QUERY_CACHE_EXPIRE | default('1') }}"
        proxy_query_cache_expire_value: "{{ config_vars_proxy_query_cache_expire.user_input | trim | default(proxy_query_cache_expire_default, true) }}"
      ansible.builtin.set_fact:
        config_data: "{{ config_data | combine({'PROXY_CONFIG': (config_data.PROXY_CONFIG | default({})) | combine({'QUERY_CACHE_EXPIRE': proxy_query_cache_expire_value}, recursive=True)}, recursive=True) }}"

    - name: "Number of days to keep cached artifact downloads before expiring them"
      prompt:
        prompt: "Enter your selection [{{ config_data.PROXY_CONFIG.ARTIFACT_CACHE_EXPIRE | default('30') }}]: "
      register: config_vars_proxy_artifact_cache_expire

    - name: Save the proxy artifact cache expiry
      vars:
        proxy_artifact_cache_expire_default: "{{ config_data.PROXY_CONFIG.ARTIFACT_CACHE_EXPIRE | default('30') }}"
        proxy_artifact_cache_expire_value: "{{ config_vars_proxy_artifact_cache_expire.user_input | trim | default(proxy_artifact_cache_expire_default, true) }}"
      ansible.builtin.set_fact:
        config_data: "{{ config_data | combine({'PROXY_CONFIG': (config_data.PROXY_CONFIG | default({})) | combine({'ARTIFACT_CACHE_EXPIRE': proxy_artifact_cache_expire_value}, recursive=True)}, recursive=True) }}"

    - name: "Comma-separated list of trusted proxy IPs"
      prompt:
        prompt: "Enter your selection [{{ config_data.PROXY_CONFIG.TRUSTED_PROXIES | default('') }}]: "
      register: config_vars_proxy_trusted_proxies

    - name: Save trusted proxy IPs
      vars:
        proxy_trusted_proxies_default: "{{ config_data.PROXY_CONFIG.TRUSTED_PROXIES | default('') }}"
        proxy_trusted_proxies_value: "{{ config_vars_proxy_trusted_proxies.user_input | trim | default(proxy_trusted_proxies_default, true) }}"
      ansible.builtin.set_fact:
        config_data: "{{ config_data | combine({'PROXY_CONFIG': (config_data.PROXY_CONFIG | default({})) | combine({'TRUSTED_PROXIES': proxy_trusted_proxies_value}, recursive=True)}, recursive=True) }}"

    - name: "Public proxy URL used in rewritten links"
      prompt:
        prompt: "Enter your selection [{{ config_data.PROXY_CONFIG.URL | default('https://{{ PROXY_HOSTNAME }}') }}]: "
      register: config_vars_proxy_url

    - name: Save the proxy URL
      vars:
        proxy_url_default: "{{ config_data.PROXY_CONFIG.URL | default('https://{{ PROXY_HOSTNAME }}') }}"
        proxy_url_value: "{{ config_vars_proxy_url.user_input | trim | default(proxy_url_default, true) }}"
      ansible.builtin.set_fact:
        config_data: "{{ config_data | combine({'PROXY_CONFIG': (config_data.PROXY_CONFIG | default({})) | combine({'URL': proxy_url_value}, recursive=True)}, recursive=True) }}"

    - name: "Upstream Galaxy server to proxy requests to"
      prompt:
        prompt: "Enter your selection [{{ config_data.PROXY_CONFIG.UPSTREAM_BASEURL | default('https://galaxy.ansible.com') }}]: "
      register: config_vars_proxy_upstream_baseurl

    - name: Save the upstream Galaxy base URL
      vars:
        proxy_upstream_baseurl_default: "{{ config_data.PROXY_CONFIG.UPSTREAM_BASEURL | default('https://galaxy.ansible.com') }}"
        proxy_upstream_baseurl_value: "{{ config_vars_proxy_upstream_baseurl.user_input | trim | default(proxy_upstream_baseurl_default, true) }}"
      ansible.builtin.set_fact:
        config_data: "{{ config_data | combine({'PROXY_CONFIG': (config_data.PROXY_CONFIG | default({})) | combine({'UPSTREAM_BASEURL': proxy_upstream_baseurl_value}, recursive=True)}, recursive=True) }}"

    - name: Prompt whether to clear the proxy cache on startup
      ansible.builtin.include_tasks: menu_choice.yml
      vars:
        config_vars_menu_prompt: "Boolean indicating whether to clear the cache directory on startup:"
        config_vars_menu_options_display: "{{ config_vars_boolean_options_display }}"
        config_vars_menu_options_value: "{{ ['1', '0'] }}"
        config_vars_menu_target: CLEAR_CACHE_ON_START
        config_vars_menu_target_parent: PROXY_CONFIG
        config_vars_menu_target_child: CLEAR_CACHE_ON_START
        config_vars_menu_default_display: "{{ 'true' if (config_data.PROXY_CONFIG.CLEAR_CACHE_ON_START | default('0')) in ['1', 'true', 'True'] else 'false' }}"
        config_vars_menu_default_value: "{{ '1' if (config_data.PROXY_CONFIG.CLEAR_CACHE_ON_START | default('0')) in ['1', 'true', 'True'] else '0' }}"

    - name: "Maximum number of API responses to keep in the in-memory cache"
      prompt:
        prompt: "Enter your selection [{{ config_data.PROXY_CONFIG.MEM_CACHE_SIZE | default('2000') }}]: "
      register: config_vars_proxy_mem_cache_size

    - name: Save the proxy memory cache size
      vars:
        proxy_mem_cache_size_default: "{{ config_data.PROXY_CONFIG.MEM_CACHE_SIZE | default('2000') }}"
        proxy_mem_cache_size_value: "{{ config_vars_proxy_mem_cache_size.user_input | trim | default(proxy_mem_cache_size_default, true) }}"
      ansible.builtin.set_fact:
        config_data: "{{ config_data | combine({'PROXY_CONFIG': (config_data.PROXY_CONFIG | default({})) | combine({'MEM_CACHE_SIZE': proxy_mem_cache_size_value}, recursive=True)}, recursive=True) }}"

    - name: "Optional outbound HTTP proxy for upstream calls"
      prompt:
        prompt: "Enter your selection [{{ config_data.PROXY_CONFIG.HTTP_PROXY | default('') }}]: "
      register: config_vars_proxy_http_proxy

    - name: Save the outbound HTTP proxy
      vars:
        proxy_http_proxy_default: "{{ config_data.PROXY_CONFIG.HTTP_PROXY | default('') }}"
        proxy_http_proxy_value: "{{ config_vars_proxy_http_proxy.user_input | trim | default(proxy_http_proxy_default, true) }}"
      ansible.builtin.set_fact:
        config_data: "{{ config_data | combine({'PROXY_CONFIG': (config_data.PROXY_CONFIG | default({})) | combine({'HTTP_PROXY': proxy_http_proxy_value}, recursive=True)}, recursive=True) }}"

    - name: "API token required for authentication to the proxy"
      prompt:
        prompt: "Enter your selection [hidden]: "
        echo: false
      register: config_vars_proxy_galaxy_api_token
      until: >-
        '"' not in (
          (config_vars_proxy_galaxy_api_token.user_input | default('', true) | trim)
          if (config_vars_proxy_galaxy_api_token.user_input | default('', true) | trim) != ''
          else (config_data.PROXY_CONFIG.GALAXY_API_TOKEN | default(''))
        )
      retries: "{{ config_vars_prompt_retries }}"
      delay: "{{ config_vars_prompt_delay }}"
      no_log: true

    - name: Save the proxy API token
      vars:
        proxy_galaxy_api_token_default: "{{ config_data.PROXY_CONFIG.GALAXY_API_TOKEN | default('') }}"
        proxy_galaxy_api_token_value: "{{ config_vars_proxy_galaxy_api_token.user_input | trim | default(proxy_galaxy_api_token_default, true) }}"
      ansible.builtin.set_fact:
        config_data: "{{ config_data | combine({'PROXY_CONFIG': (config_data.PROXY_CONFIG | default({})) | combine({'GALAXY_API_TOKEN': proxy_galaxy_api_token_value}, recursive=True)}, recursive=True) }}"
      no_log: true
  when: config_data.PROXY_INSTALL | default(false) | bool
