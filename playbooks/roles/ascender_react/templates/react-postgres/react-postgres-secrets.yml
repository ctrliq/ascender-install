{#
  PostgreSQL configuration for an instance the EDA Operator must not manage -
  either the one Ascender already runs (REACT_PGSQL_MODE: ascender) or one supplied by
  the operator of this cluster (REACT_PGSQL_MODE: external).

  The 'type' key is what the operator reads to decide whether it owns the database
  (roles/postgres/tasks/set_variables.yml); anything other than 'managed' keeps it from
  deploying a second PostgreSQL StatefulSet. The event-stream secret is mandatory in
  that case - the operator fails the reconcile without it, because it can only create
  that role by itself on a database it manages.

  These are deliberately NOT named <name>-postgres-configuration: that is the name the
  operator generates for a managed install, and overwriting it would strand the
  StatefulSet of an existing managed deployment. The names below are referenced from
  the custom resource through database.database_secret and event_stream.database_secret.
#}
---
apiVersion: v1
kind: Secret
metadata:
  name: ascender-react-postgres-external-configuration
  namespace: {{ REACT_NAMESPACE }}
  labels:
    app.kubernetes.io/part-of: ascender-react
    app.kubernetes.io/managed-by: ascender-install
type: Opaque
stringData:
  host: {{ react_pg_host }}
  port: '{{ react_pg_port }}'
  database: {{ react_pg_database }}
  username: {{ react_pg_user }}
  password: {{ react_pg_password }}
  sslmode: {{ react_pg_sslmode }}
  type: unmanaged
---
apiVersion: v1
kind: Secret
metadata:
  name: ascender-react-event-stream-external-configuration
  namespace: {{ REACT_NAMESPACE }}
  labels:
    app.kubernetes.io/part-of: ascender-react
    app.kubernetes.io/managed-by: ascender-install
type: Opaque
stringData:
  host: {{ react_pg_host }}
  port: '{{ react_pg_port }}'
  database: {{ react_pg_database }}
  username: {{ react_pg_event_stream_user }}
  password: {{ react_pg_event_stream_password }}
  sslmode: {{ react_pg_sslmode }}
  type: unmanaged
