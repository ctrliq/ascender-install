---
apiVersion: v1
kind: Secret
metadata:
  name: ascender-react-admin-password
  namespace: {{ REACT_NAMESPACE }}
stringData:
  password: {{ REACT_ADMIN_PASSWORD }}
{#
  an external-database Secret used to be rendered here. It could never work:
  it was gated on ASCENDER_PGSQL_HOST while filling in REACT_PGSQL_* values, it was
  named after Ascender's secret rather than React's, and nothing in the custom resource
  below ever referenced it. The database configuration is now built by
  tasks/react_postgres.yml, which also creates the event-stream secret the EDA Operator
  demands alongside it, and is referenced from spec.database below.
#}
{% if k8s_lb_protocol == 'https' %}
---
apiVersion: v1
data:
  tls.crt: {{ lookup('ansible.builtin.file', react_tls_crt_path) | b64encode }}
  tls.key: {{ lookup('ansible.builtin.file', react_tls_key_path) | b64encode }}
kind: Secret
metadata:
  name: ascender-react-tls-secret
  namespace: {{ REACT_NAMESPACE }}
type: kubernetes.io/tls
{% endif %}
---
# EDA Server Object
apiVersion: eda.ansible.com/v1alpha1
kind: EDA
metadata:
  name: ascender-react
  namespace: {{ REACT_NAMESPACE }}
spec:
  automation_server_url: https://{{ ASCENDER_HOSTNAME }}
  image: {{ REACT_IMAGE }}
  image_version: {{ REACT_IMAGE_VERSION }}
  image_web: {{ REACT_IMAGE_WEB }}
  image_web_version: {{ REACT_IMAGE_WEB_VERSION }}
  admin_user: {{ REACT_ADMIN_USER }}
  admin_password_secret: ascender-react-admin-password
{% if react_pg_external | default(false) | bool %}
  # React is using a PostgreSQL instance the operator must not manage - either
  # the one Ascender runs (REACT_PGSQL_MODE: ascender) or an external one. Both secrets
  # are required: without the event-stream one the operator refuses to reconcile.
  database:
    database_secret: ascender-react-postgres-external-configuration
  event_stream:
    database_secret: ascender-react-event-stream-external-configuration
{% endif %}
  service_type: ClusterIP
  # the operator's UI Ingress publishes the event-stream backend on a hardcoded
  # "/" next to the UI on the same host (eda-ui.ingress.yaml.j2). Two identical rules
  # make the ingress controller keep only one of them - Traefik keeps the event-stream
  # one - and the React UI then answers 404 on every request. The role applies its own
  # Ingress (templates/react-deployment/react-ingress.yml) instead, which routes the
  # event-stream prefix and the UI to the right services; hostname stays set because
  # the operator uses it for the API's allowed hosts and public URL.
  ingress_type: none
  hostname: {{ REACT_HOSTNAME }}
  no_log: false
  websocket_ssl_verify: false
  image_pull_policy: Always
  extra_settings:
  - setting: CSRF_TRUSTED_ORIGINS
    value:
      - http{% if k8s_lb_protocol == 'https' %}s{% endif %}://{{ REACT_HOSTNAME }}
